[project]
name = "ai-analytics-backend"
version = "0.1.0"
description = "Python backend for a desktop AI analytics/voice agent. UI-independent; consumed by a future Tauri + React frontend via FastAPI."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # --- Phase 1: config, models, credentials, API skeleton ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",

    # --- Added in later phases (kept here so `pip install -e .` stays stable
    #     as the project grows; unused imports are not present yet) ---
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "groq>=0.11.0",
    "mcp>=1.0.0",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
